[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pigame"
version = "0.1.0"
description = "Idle e-ink RPG pet for Raspberry Pi Zero 2 W"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0"
]

[project.scripts]
pigame = "pigame.cli:main"
pigame-manager = "pigame.desktop_server:main"
pigame-runtime = "pigame.runtime:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
